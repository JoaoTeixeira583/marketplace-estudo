spring.application.name=marketplace-estudo

spring.datasource.url=jdbc:postgresql://localhost:5432/marketplace_estudo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

cadastro.datasource.url=jdbc:mysql://localhost:3306/marketplace_cadastro
cadastro.datasource.username=${MYSQL_USERNAME}
cadastro.datasource.password=${MYSQL_PASSWORD}
cadastro.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
cadastro.jpa.properties.hibernate.hbm2ddl.auto=update